  <rect width="1200" height="1500" filter="url(#wminimal-grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
  <text x="40" y="64" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" letter-spacing="4"
